name: Run Claude GCP Analysis

# 設定觸發條件
on:
  # 1. 排程觸發：例如設定為每天台灣時間早上 8 點執行 (UTC 0 點)
  schedule:
    - cron: '0 0 * * *'
  
  # 2. 手動觸發：允許你在 GitHub 網頁上隨時按按鈕手動執行
  workflow_dispatch:

jobs:
  run-python-script:
    runs-on: ubuntu-latest
    steps:
      # 1. 下載你的專案程式碼
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 設定 Python 環境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      # 3. 安裝必要套件
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # 4. 執行 Python 程式（同時將 GitHub Secrets 注入為環境變數）
      - name: Run Python script
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        run: |
          python main.py
